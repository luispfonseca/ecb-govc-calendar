name: Updates ics calendar

on:
  #push:
  workflow_dispatch:
  schedule:
    - cron:  '5 0 * * 5'

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
    - name: Check out this repo
      uses: actions/checkout@v7
    - name: Install system dependencies
      run: |-
        apt-get update && apt-get -y install libxml2-dev ca-certificates
        update-ca-certificates
    - name: Install xml2
      run: |-
        Rscript -e 'install.packages("xml2")'
    - name: Download and treat
      run: |-
        Rscript ecb.R
    - name: Commit and push if it changed
      run: |-
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config user.name "Automatic"
        git config user.email "actions@users.noreply.github.com"
        git add docs/
        timestamp=$(date -u)
        git commit -m "Automatic update of ics calendar: ${timestamp}" || exit 0
        git push

    container: rocker/r-ver:latest
